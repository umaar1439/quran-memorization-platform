<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="robots" content="noindex">
        <title>لا يوجد اتصال — تحفيظ</title>
        <style>
            /* صفحة مستقلة بالكامل: لا تعتمد على /build ولا على خطوط خارجية،
               لأنها تُعرَض تحديداً حين لا تتوفر الشبكة. */
            :root {
                color-scheme: light dark;
                --bg: #f9fafb;
                --surface: #ffffff;
                --text: #111827;
                --muted: #6b7280;
                --edge: #e5e7eb;
                --brand: #0f766e;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #111827;
                    --surface: #1f2937;
                    --text: #f9fafb;
                    --muted: #9ca3af;
                    --edge: #374151;
                    --brand: #2dd4bf;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: var(--bg);
                color: var(--text);
                line-height: 1.75;
                font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
            }

            .card {
                width: 100%;
                max-width: 28rem;
                padding: 32px 24px;
                text-align: center;
                background: var(--surface);
                border: 1px solid var(--edge);
                border-radius: 16px;
            }

            .icon {
                width: 56px;
                height: 56px;
                margin: 0 auto 16px;
                display: grid;
                place-items: center;
                border-radius: 999px;
                background: color-mix(in oklab, var(--brand) 12%, transparent);
                color: var(--brand);
            }

            h1 {
                margin: 0 0 8px;
                font-size: 1.125rem;
            }

            p {
                margin: 0 0 20px;
                color: var(--muted);
                font-size: 0.9375rem;
            }

            button {
                min-height: 44px;
                padding: 0 20px;
                border: 0;
                border-radius: 10px;
                cursor: pointer;
                background: var(--brand);
                color: #ffffff;
                font: inherit;
                font-weight: 600;
            }

            button:focus-visible {
                outline: 2px solid var(--brand);
                outline-offset: 2px;
            }

            @media (prefers-reduced-motion: no-preference) {
                button {
                    transition: opacity 150ms cubic-bezier(0.2, 0, 0, 1);
                }
            }

            button:active {
                opacity: 0.85;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <span class="icon" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M5 12.86a12 12 0 0 1 5.17-2.69M2 8.82a16 16 0 0 1 4.17-2.39M22 8.82a16 16 0 0 0-11.29-1.9M2 2l20 20" />
                </svg>
            </span>
            <h1>لا يوجد اتصال بالإنترنت</h1>
            <p>التسميعات التي أدخلتها بلا اتصال محفوظة على جهازك وستُزامن تلقائياً عند عودة الشبكة.</p>
            <button type="button" onclick="location.reload()">إعادة المحاولة</button>
        </main>
    </body>
</html>
